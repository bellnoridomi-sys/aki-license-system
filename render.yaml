services:
  - type: web
    name: aki-license-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: cat source-*.b64 | base64 -d | tar -xz && pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aki-license-db
          property: connectionString
      - key: AKI_SESSION_SECRET
        generateValue: true
      - key: AKI_ADMIN_USERNAME
        sync: false
      - key: AKI_ADMIN_PASSWORD
        sync: false
      - key: AKI_COOKIE_SECURE
        value: "true"

databases:
  - name: aki-license-db
    databaseName: aki_license
    plan: free
    region: singapore
    postgresMajorVersion: "18"
